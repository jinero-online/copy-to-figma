<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>copy-to-figma — demo</title>
<style>
    :root { color-scheme: light; }
    body { font-family: Inter, -apple-system, system-ui, sans-serif; margin: 0; background: #F4F4F5; color: #1B1B1B; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px 80px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p.lead { color: #555; margin: 0 0 24px; max-width: 60ch; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
    button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 1px solid #d8d8de; background: #fff; cursor: pointer; }
    button.primary { background: #111; color: #fff; border-color: #111; }
    button:hover { filter: brightness(0.96); }
    .hint { font-size: 13px; color: #777; margin: -16px 0 28px; }
    #preview { background: #fff; border: 1px solid #e4e4e9; border-radius: 14px; padding: 16px; overflow: auto; }
    #preview svg { max-width: 100%; height: auto; display: block; }
    a { color: #4f46e5; }
</style>
</head>
<body>
<div class="wrap">
    <h1>copy-to-figma</h1>
    <p class="lead">Click a button, switch to Figma, press <b>⌘V</b> — the board arrives as an editable frame: vectors stay vectors, text stays text. No plugin required. <a href="https://github.com/jinero-online/copy-to-figma">GitHub</a></p>

    <div class="row">
        <button class="primary" id="btnStyleguide">Copy full styleguide</button>
        <button id="btnColors">Copy palette</button>
        <button id="btnType">Copy type scale</button>
        <button id="btnIcons">Copy icon grid</button>
    </div>
    <p class="hint">The same board is previewed below exactly as generated.</p>

    <div id="preview"></div>
</div>

<!-- GH Pages serves only /docs, so the IIFE build is copied here by `npm run build` -->
<script src="./copy-to-figma.iife.js"></script>
<script>
    const K = window.CopyToFigma;

    const colors = [{
        label: 'Brand',
        items: [
            { hex: '#6366F1', label: 'primary' }, { hex: '#4338CA', label: 'primary-deep' },
            { hex: '#111827', label: 'ink' }, { hex: '#6B7280', label: 'muted' }, { hex: '#F9FAFB', label: 'paper' },
        ],
    }];
    const typography = [
        { tag: 'H1', family: 'Inter', size: '48px', weight: '700', lineHeight: '1.1', sample: 'Grow the good' },
        { tag: 'H2', family: 'Inter', size: '32px', weight: '700', lineHeight: '1.2', sample: 'Sections that sing' },
        { tag: 'Body', family: 'Inter', size: '16px', weight: '400', lineHeight: '1.5', sample: 'The quick brown fox jumps over the lazy dog' },
        { tag: 'Caption', family: 'Inter', size: '12px', weight: '500', letterSpacing: '0.04em', sample: 'FINE PRINT, STILL EDITABLE' },
    ];
    const icon = (d) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const icons = [
        { name: 'home', svg: icon('<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>') },
        { name: 'heart', svg: icon('<path d="M19 14c1.5-1.4 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.1 3 5.5l7 7z"/>') },
        { name: 'search', svg: icon('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>') },
        { name: 'settings', svg: icon('<circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4M4.2 4.2l2.9 2.9m9.8 9.8 2.9 2.9M1 12h4m14 0h4M4.2 19.8l2.9-2.9m9.8-9.8 2.9-2.9"/>') },
        { name: 'download', svg: icon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>') },
    ];
    const styleguide = {
        colors, typography, icons,
        fonts: [{ family: 'Inter', note: 'variable · 9 weights' }, { family: 'Georgia', note: 'serif fallback' }],
        spacing: [{ label: 'xs', px: 4 }, { label: 'sm', px: 8 }, { label: 'md', px: 16 }, { label: 'lg', px: 32 }, { label: 'xl', px: 64 }],
        radius: [4, 8, 16, 9999],
        shadows: ['0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.12)', '0 4px 10px rgba(20,20,40,.25)'],
        buttons: [
            { text: 'Get started', bgColor: '#6366F1', textColor: '#fff', borderRadius: '9999px', fontSize: '15px', fontWeight: '600', padding: '10px 22px' },
            { text: 'Learn more', bgColor: '#ffffff', textColor: '#111', borderRadius: '8px', fontSize: '14px', fontWeight: '500', padding: '8px 16px', border: '1px solid #D0D5DD' },
        ],
    };

    const preview = document.getElementById('preview');
    async function run(btn, build, copy, arg) {
        const { svg } = build(arg);
        preview.innerHTML = svg;
        try {
            const n = await copy(arg);
            const old = btn.textContent;
            btn.textContent = `Copied ${n} items ✓ — paste in Figma`;
            setTimeout(() => { btn.textContent = old; }, 2200);
        } catch (e) {
            btn.textContent = 'Clipboard needs https + a click';
        }
    }

    document.getElementById('btnStyleguide').addEventListener('click', (e) => run(e.target, K.buildStyleguideSvg, K.copyStyleguideToClipboard, styleguide));
    document.getElementById('btnColors').addEventListener('click', (e) => run(e.target, K.buildColorsSvg, K.copyColorsToClipboard, colors));
    document.getElementById('btnType').addEventListener('click', (e) => run(e.target, K.buildTypographySvg, K.copyTypographyToClipboard, typography));
    document.getElementById('btnIcons').addEventListener('click', (e) => run(e.target, K.buildIconsSvg, K.copyIconsToClipboard, icons));

    // initial preview
    preview.innerHTML = K.buildStyleguideSvg(styleguide).svg;
</script>
</body>
</html>
